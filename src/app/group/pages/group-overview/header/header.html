<div class="sentinel" #sentinel></div>

<div class="slot" #slot>
  <div class="header">
    <div class="icon">
      <img class="icon__img" [src]="icon()" alt="">
    </div>

    <div class="info">
<!--      <h3>{{ name() }}</h3>-->
      <app-nickname [value]="name()" />
    </div>

    @if (canExit()) {
      <div class="exit-button">
        <button matRipple class="exit" type="button" aria-label="Выйти" (click)="exit.emit()">
          <img src="icons/exit.svg" class="exit-icon" alt="">
        </button>
      </div>
    }
  </div>
</div>
