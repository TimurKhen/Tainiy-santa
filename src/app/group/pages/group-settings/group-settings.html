<div class="container">
  @if (gameData(); as data) {
    <div class="settings-container">
      <h2>Настройки</h2>

      <div class="settings">
        <app-edit-text-input
          icon="💰"
          label="Бюджет"
          [valueInput]="String(data.money)"
          (valueChange)="updateMoney($event)"
        />

        <hr>

        <app-edit-date-input
          icon="📅"
          label="Даты"
          [first]="distribution()"
          [second]="exchange()"
          (valueChange)="updateDates($event)"
        />

        <hr>

        <app-edit-text-input
          icon="📍"
          label="Место"
          [valueInput]="data.place"
          (valueChange)="updateWhere($event)"
        />
      </div>
    </div>
  }

  <button class="delete-group" (click)="deleteGroup()">
    <p>Удалить группу</p>
  </button>
</div>

@if (!isTyping()) {
  <div class="bottom-buttons">
    <button (click)="save()" [disabled]="isSaving()">
      {{ isSaving() ? 'Сохранение…' : 'Сохранить' }}
    </button>
  </div>
}
