<div class="container">
  @if (gameData(); as data) {
    <div class="settings-container">
      <p>Настройки</p>

      <div class="settings">
        <app-edit-text-input
          icon="💰"
          label="Бюджет"
          [valueInput]="String(data.data.money)"
        />

        <hr>

        <app-edit-date-input
          icon="📅"
          label="Даты"
          [first]="distribution()"
          [second]="exchange()"
          (valueChange)="updateDates($event)"
        />

        <hr>
        
        <app-edit-text-input
          icon="📍"
          label="Место"
          [valueInput]="String(data.data.where)"
        />
      </div>
    </div>
  }
</div>
