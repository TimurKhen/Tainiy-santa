<div class="input" (click)="changeValue()">
  <div class="label" [class.editing]="isEditing()">
    <p>{{ icon() }}</p>
    <h3>{{ label() }}</h3>
  </div>

  <div class="value-wrapper">
    <div class="value" [class.hidden]="isEditing()">
      <p>{{ value() }}</p>
      <svg data-dc-tpl="25" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#A3A3A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path data-dc-tpl="26" d="m1 1 6 6-6 6"></path></svg>
    </div>

    <div class="input-wrapper" [class.visible]="isEditing()">
      <input
        #inputElement
        onfocus="setTimeout(() => this.scrollIntoView({ block: 'center', behavior: 'smooth' }), 100)"
        (keyup.enter)="newValue(null)"
        [value]="value()"
        [(ngModel)]="value"
      >

      <button class="ok" (click)="newValue($event)">
        <img src="icons/ok.svg">
      </button>

      <button class="no" (click)="close($event)">
        <img src="icons/no.svg">
      </button>
    </div>
  </div>
</div>
