<div class="input" (click)="changeValue()">
  <div class="header-row">
    <div class="label">
      <p>{{ icon() }}</p>
      <h3>{{ label() }}</h3>
    </div>

    <div class="value" [class.hidden]="isEditing()">
      <p>{{ first().value | date:'d MMM':'':'ru' }} → {{ second().value | date:'d MMM':'':'ru' }}</p>
      <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#A3A3A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m1 1 6 6-6 6"></path>
      </svg>
    </div>
  </div>

  <div class="input-wrapper" [class.visible]="isEditing()">
    <div class="input-zone" (click)="$event.stopPropagation()">
      <div class="text">
        <p>{{ first().icon }}</p>
        <h3>{{ first().label }}</h3>
      </div>

      <p>{{ firstValue() | date:'d MMM':'':'ru' }}</p>

      <input
        type="date"
        class="native-calendar"
        [disabled]="firstLocked()"
        [min]="today()"
        [ngModel]="firstValue()"
        (ngModelChange)="onFirstChange($event)"
      />
    </div>

    <hr>

    <div class="input-zone" (click)="$event.stopPropagation()">
      <div class="text">
        <p>{{ second().icon }}</p>
        <h3>{{ second().label }}</h3>
      </div>

      <p>{{ secondValue() | date:'d MMM':'':'ru' }}</p>

      <input
        type="date"
        class="native-calendar"
        [disabled]="secondLocked()"
        [min]="minSecond()"
        [ngModel]="secondValue()"
        (ngModelChange)="onSecondChange($event)"
      />
    </div>

    <div class="actions">
      <button class="ok" [disabled]="!isValid()" (click)="newValue($event)">
        <img src="icons/ok.svg">
      </button>

      <button class="no" (click)="close($event)">
        <img src="icons/no.svg">
      </button>
    </div>
  </div>
</div>
