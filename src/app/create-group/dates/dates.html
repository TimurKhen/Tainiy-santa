<div class="container">
  <p>Даты</p>

  <div class="dates">
    <label (click)="distributionInput.focus()" class="select distribution-date">
      <div class="title">
        <h3>🎲</h3>
        <p>Жеребьёвка</p>
      </div>

      <div class="date">
        <p>{{ distributionDate() | datePipeWithCheck }}</p>
        <svg data-dc-tpl="25" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#A3A3A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path data-dc-tpl="26" d="m1 1 6 6-6 6"></path></svg>
      </div>

      <input
        #distributionInput
        type="date"
        id="distributionDatePicker"
        class="native-calendar"
        [(ngModel)]="distributionDate"
        [min]="today()"
      />
    </label>

    <hr>

    <label (click)="swapInput.focus()" class="select swap-date">
      <div class="title">
        <h3>🎁</h3>
        <p>Обмен подарками</p>
      </div>

      <div class="date">
        <p>{{ swapDate() | datePipeWithCheck }}</p>
        <svg data-dc-tpl="25" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#A3A3A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path data-dc-tpl="26" d="m1 1 6 6-6 6"></path></svg>
      </div>

      <input
        #swapInput
        type="date"
        id="swapDatePicker"
        class="native-calendar"
        [(ngModel)]="swapDate"
        [min]="today()"
      />
    </label>
  </div>
</div>
