<div class="container">
  <p>Даты</p>

  <div class="dates">
    <label class="select distribution-date">
      <div class="title">
        <h3>🎲</h3>
        <p>Жеребьёвка</p>
      </div>

      <div class="date">
        <p>{{ distributionDate() | date:'mediumDate' }}</p>
        <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#A3A3A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m1 1 6 6-6 6"></path></svg>
        <input #distributionDateInput type="date" class="native-calendar" [(ngModel)]="distributionDate" [min]="minDistributionDate()" [max]="maxDistributionDate()" (click)="openPicker(distributionDateInput)" aria-label="Дата жеребьёвки">
      </div>

    </label>

    <hr>

    <label class="select distribution-time">
      <div class="title">
        <h3>🕐</h3>
        <p>Время жеребьёвки</p>
      </div>

      <div class="time">
        <p>{{ distributionTime() }}</p>
        <svg width="8" height="14" viewBox="0 0 8 14"
             fill="none" stroke="#A3A3A8" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="m1 1 6 6-6 6"></path>
        </svg>

        <input
          #distributionTimeInput
          type="time"
          class="native-time"
          [(ngModel)]="distributionTime"
          (click)="openPicker(distributionTimeInput)"
          aria-label="Время жеребьёвки"
        >
      </div>
    </label>

    <hr>

    <label class="select swap-date">
      <div class="title">
        <h3>🎁</h3>
        <p>Обмен подарками</p>
      </div>

      <div class="date">
        <p>{{ swapDate() | date:'mediumDate' }}</p>
        <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#A3A3A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m1 1 6 6-6 6"></path></svg>
        <input #swapDateInput type="date" class="native-calendar" [(ngModel)]="swapDate" [min]="minSwapDate()" (click)="openPicker(swapDateInput)" aria-label="Дата обмена">
      </div>
    </label>

    <hr>

    <label class="select swap-time">
      <div class="title">
        <h3>🕐</h3>
        <p>Время обмена</p>
      </div>

      <div class="time">
        <p>{{ swapTime() }}</p>
        <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#A3A3A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m1 1 6 6-6 6"></path></svg>
        <input #swapTimeInput type="time" class="native-time" [(ngModel)]="swapTime" (click)="openPicker(swapTimeInput)" aria-label="Время обмена">
      </div>
    </label>


  </div>
</div>
