<div class="container">
  <p>Даты</p>

  <div class="dates">
    <label class="select distribution-date">
      <div class="title">
        <h3>🎲</h3>
        <p>Жеребьёвка</p>
      </div>

      <div class="date">
        <p>{{ distributionDate() | date:'mediumDate'}}</p>
        <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#A3A3A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m1 1 6 6-6 6"></path></svg>
      </div>

      <input
        #distributionInput
        type="date"
        class="native-calendar"
        [(ngModel)]="distributionDate"
        [min]="today()"
        (click)="openPicker(distributionInput)"
      />
    </label>

    <hr>

    <label class="select swap-date">
      <div class="title">
        <h3>🎁</h3>
        <p>Обмен подарками</p>
      </div>

      <div class="date">
        <p>{{ swapDate() | date:'mediumDate'}}</p>
        <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#A3A3A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m1 1 6 6-6 6"></path></svg>
      </div>

      <input
        #swapInput
        type="date"
        class="native-calendar"
        [(ngModel)]="swapDate"
        [min]="distributionDate() || today()"
        (click)="openPicker(swapInput)"
      />
    </label>
  </div>
</div>
