<div class="container">
  <div class="header">
    <h2>Новая игра <img src="tgGifs/christmasTree.webp"></h2>
    <p>Задайте правила - их увидят все участники</p>
  </div>

  <form class="form" [formGroup]="createForm">
    <label class="name">
      <p>Название</p>

      <div class="tag">
        <input
          formControlName="name"
          #nameInput
          maxlength="20"
          (focus)="onInputFocus(nameInput)"
          (blur)="onInputBlur()"
          (keyup.enter)="nameInput.blur()"
          placeholder="Название вашей игры"
        >
      </div>

      @let nameControl = createForm.controls.name;
      @if (nameControl.touched && nameControl.invalid) {
        <span class="error">
          @if (nameControl.hasError('required')) {
            Введите название игры
          } @else if (nameControl.hasError('maxlength')) {
            Название не должно быть длиннее 20 символов
          }
        </span>
      }
    </label>

    <label class="place">
      <p>Место проведения</p>

      <div class="tag">
        <input
          formControlName="place"
          #placeInput
          maxlength="20"
          (focus)="onInputFocus(placeInput)"
          (blur)="onInputBlur()"
          (keyup.enter)="placeInput.blur()"
          placeholder="Где будет проводиться обмен?"
        >
      </div>

      @let placeControl = createForm.controls.place;
      @if (placeControl.touched && placeControl.invalid) {
        <span class="error">
          @if (placeControl.hasError('required')) {
            Укажите место проведения
          } @else if (placeControl.hasError('maxlength')) {
            Место не должно быть длиннее 20 символов
          }
        </span>
      }
    </label>

    <div class="icons">
      <p>Обложка</p>
      <app-icon-select [control]="createForm.controls.icon"></app-icon-select>
    </div>

    <app-gift-budget [control]="createForm.controls.budget"></app-gift-budget>

    <app-dates
      [distributionControl]="createForm.controls.distributionDate"
      [swapControl]="createForm.controls.swapDate"
    ></app-dates>
  </form>
</div>

@if (!isInputFocused()) {
  <div class="bottom">
    <button
      [disabled]="!isValid() || isCreating()"
      class="create-button"
      matRipple
      (click)="onCreate($event)">
      @if (isValid()) {
        @if (isCreating()) {
          Создаём вашу игру
        } @else {
          Создать
        }
      } @else {
        Заполните все поля
      }
    </button>
  </div>
}
