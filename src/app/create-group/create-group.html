<div class="container">
  <div class="header">
    <h2>Новая игра <img src="tgGifs/christmasTree.webp"></h2>
    <p>Задайте правила - их увидят все участники</p>
  </div>

  <div class="form" [formGroup]="createForm">
    <label class="name">
      <p>Название</p>

      <div class="tag">
        <input
          #nameInput
          (keyup.enter)="nameInput.blur()"
          placeholder="Название вашей игры"
        >
      </div>
    </label>

    <div class="icons">
      <p>Обложка</p>
      <app-icon-select></app-icon-select>
    </div>

    <app-gift-budget></app-gift-budget>

    <app-dates></app-dates>
  </div>
</div>

<div class="bottom">
  <button
    class="create-button"
    [disabled]="!createForm.valid"
    (click)="onCreate($event)">
    @if (createForm.valid) {
      Создать и пригласить
    } @else {
      Заполните все поля
    }
  </button>
</div>
