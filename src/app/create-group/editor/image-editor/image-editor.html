<vo-popup [isShow]="isShow()" (closedEvent)="close()">
  <div class="cropper-content">
    <div class="cropper-editor">
      @if (isCropping()) {
        <image-cropper
          [imageFile]="imageFile()"
          [backgroundColor]="bgColor()"
          [maintainAspectRatio]="true"
          [containWithinAspectRatio]="true"
          [aspectRatio]="1/1"
          [roundCropper]="true"
          [resizeToWidth]="512"
          [onlyScaleDown]="true"
          format="png"
          (imageCropped)="imageCropped($event)"
          (loadImageFailed)="clear()"

        ></image-cropper>
      } @else {
        <div class="block skeleton" (click)="selectNewFile()">
          <p>{{ isLoading() ? 'Загрузка…' : 'Загрузите фото' }}</p>
        </div>
      }

      @if (isCropping()) {
        <button class="delete-btn" (click)="clear()">
          Удалить
        </button>
      }
    </div>
    <div class="cropper-buttons">
      <button class="save-btn" (click)="save()">Подтвердить</button>
      <button class="cancel-btn" (click)="cancel()">Отменить</button>
    </div>
  </div>
</vo-popup>
